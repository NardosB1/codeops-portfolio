<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Habesha Eatery, Bole</title>
    <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa. View our opening hours and send us a message.">
</head>
<body>
    <header>
        <h1>Contact Habesha Eatery</h1>
        <nav>
            <a href="index.html">Reservations</a> | 
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Send Us a Message</h2>
            <form action="/contact" method="post">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" required> <br>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required> <br>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required></textarea> <br>
                <button type="submit">Send Message</button>
            </form>
        </section>

        <section>
            <h2>Opening Hours</h2>
            <table>
                <caption>Weekly Operating Schedule</caption>
                <thead>
                    <tr>
                        <th scope="col">Day</th>
                        <th scope="col">Hours</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Monday - Friday</td>
                        <td>10:00 AM - 10:00 PM</td>
                        </tr>
                    <tr>
                        <td>Saturday - Sunday</td>
                        <td>11:00 AM - 11:30 PM</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Bole, Addis Ababa</p>
    </footer>
</body>
</html>
