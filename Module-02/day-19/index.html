<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addis Market — Shopping List</title>

  <link rel="stylesheet" href="C:\Users\aenda\OneDrive\Desktop\IBT\Module-02\day-19\styles.css"/>
</head>
<body>

  <main class="receipt" aria-labelledby="page-title">

    <header class="receipt__header">
      <p class="eyebrow">Addis Market</p>
      <h1 id="page-title">Shopping List</h1>
      <p class="subtitle">Add what you need. Tap an item once it's in your basket.</p>
    </header>

    <form id="add-form" class="add-form" novalidate>
      <div class="field field--name">
        <label for="name">Item</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="e.g. Teff flour"
          autocomplete="off"
        />
      </div>

      <div class="field field--price">
        <label for="price">Price (ETB)</label>
        <input
          type="number"
          id="price"
          name="price"
          placeholder="0.00"
          min="0"
          step="0.01"
          inputmode="decimal"
        />
      </div>

      <button type="submit" class="btn-add">Add item</button>
    </form>

    <section class="list-section" aria-live="polite">
      <ul id="list" class="list"></ul>
      <p id="empty-state" class="empty-state">
        Your list is empty — add your first item above.
      </p>
    </section>

    <div class="tear-line" aria-hidden="true"></div>

    <footer class="total-row">
      <span class="total-label">Total</span>
      <span id="total" class="total-amount">0.00 ETB</span>
    </footer>

  </main>

  <script src="C:\Users\aenda\OneDrive\Desktop\IBT\Module-02\day-19\app.js"></script>
</body>
</html>
